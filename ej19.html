<!doctype html>
<html lang="es">
  <head>
  <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>19 · Menú de opciones — Ejercicios Web07</title>
    <meta
      name="description"
      content="Ejercicio 19 de Web07: Menú de opciones."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 4 va ANTES de styles.css: components.css lo reescribe -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script>
      document.addEventListener("DOMContentLoaded", function (){
          var flagArc = 0;
          var flagGes = 0;
          var flagRep = 0;

          function archivo() {
              if (flagArc == 0) {
                  flagArc = 1;
                  var arrayArchivo = ["Productos", "Proveedores", "Clientes", "Empleados"];
                  var itemNuevo = document.getElementById("idArc");
                  for (var i = 0; i < arrayArchivo.length; i++) {
                  var nuevoLi = document.createElement("li");
                  nuevoLi.textContent = arrayArchivo[i];
                  itemNuevo.appendChild(nuevoLi);
                  }
              } else {
                  flagArc = 0;
                  var ulArc = document.querySelectorAll("ul")[1];
                  while (ulArc.querySelectorAll("li").length > 0) {
                  ulArc.querySelector("li").remove();
                  }
              }
          }

          function gestion() {
              if (flagGes == 0) {
                  flagGes = 1;
                  var arrayGestion = ["Compras", "Ventas", "Devoluciones"];
                  var itemNuevo = document.getElementById("idGes");
                  for (var i = 0; i < arrayGestion.length; i++) {
                  var parrafo = document.createElement("li");
                  parrafo.textContent = arrayGestion[i];
                  itemNuevo.appendChild(parrafo);
                  }
              } else {
                  flagGes = 0;
                  var ulArc = document.querySelectorAll("ul")[2];
                  while (ulArc.querySelectorAll("li").length > 0) {
                  ulArc.querySelector("li").remove();
                  }
              }
          }

          function reportes() {
              if (flagRep == 0) {
                  flagRep = 1;
                  var arrayReportes = [
                  "Ventas consolidadas",
                  "Ventas al crédito",
                  "Compras al crédito",
                  "Clientes morosos",
                  "Balance mensual"
                  ];
                  var itemNuevo = document.getElementById("idRep");
                  for (var i = 0; i < arrayReportes.length; i++) {
                  var parrafo = document.createElement("li");
                  parrafo.textContent = arrayReportes[i];
                  itemNuevo.appendChild(parrafo);
                  }
              } else {
                  flagRep = 0;
                  var ulRep = document.querySelectorAll("ul")[3];
                  while (ulRep.querySelectorAll("li").length > 0) {
                  ulRep.querySelector("li").remove();
                  }
              }
          }

          document.getElementById("btnArchivo").addEventListener("click", function (){
              archivo();
          });

          document.getElementById("btnGestion").addEventListener("click", function (){
              gestion();
          });

          document.getElementById("btnReportes").addEventListener("click", function (){
              reportes();
          });
      });
        </script>
  </head>

  <body class="legacy ejercicio" data-ejercicio="19">
    <header class="ej-head">
      <a href="ejercicios.html#ej19" class="ej-back">← Ejercicios</a>
      <span class="ej-num">19</span>
      <span class="ej-name">Menú de opciones</span>
    </header>

    <button id="btnArchivo" class="btn btn-primary">Archivo</button>
    <button id="btnGestion" class="btn btn-primary">Gestion</button>
    <button id="btnReportes" class="btn btn-primary">Reportes</button>
    <ul>
        <li>Archivo</li>
        <ul id="idArc"></ul>
        <li>Gestion</li>
        <ul id="idGes"></ul>
        <li>Reportes</li>
        <ul id="idRep"></ul>
        <li>Salir</li>
    <ul>
  </body>
</html>
