<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>19 · Radio con doble clic — Ejercicios Web07</title>
    <meta
      name="description"
      content="Ejercicio 19 de Web07: Radio con doble clic."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 4 va ANTES de styles.css: components.css lo reescribe -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll('input[type="radio"]').forEach(function (radio) {
          radio.addEventListener("dblclick", function () {
            this.checked = false;
          });
        });
      });
        </script>
  </head>

  <body class="legacy ejercicio" data-ejercicio="19">
    <header class="ej-head">
      <a href="ejercicios.html#ej19" class="ej-back">← Ejercicios</a>
      <span class="ej-num">19</span>
      <span class="ej-name">Radio con doble clic</span>
    </header>

    <p>Elija la carrera de su preferencia (doble click=ninguno)</p>
    <input type="radio" name="grupo" value="1" />Sistemas
    <input type="radio" name="grupo" value="2" />Industrial
    <input type="radio" name="grupo" value="3" />Civil
    <input type="radio" name="grupo" value="4" />Biomedica
  </body>
</html>
