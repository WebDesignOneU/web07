    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        function eliminaOption() {
          var objetoSelect = document.querySelectorAll("option");
          if (objetoSelect.length > 1) {
            objetoSelect.forEach(function (option, index) {
              if (index > 0 && option.selected) {
                Swal.fire("Mensaje", "Eligió el valor " + option.value, "info");
                option.remove();
              }
            });
          } else {
            Swal.fire(
              "Mensaje",
              "¡No hay más opciones para eliminar!",
              "error"
            );
          }
        }

        document
          .querySelector("input[name='eliminaOpcion']")
          .addEventListener("click", function () {
            eliminaOption();
          });
      });
        </script>
  </head>

    <input type="button" name="eliminaOpcion" class="btn btn-primary" value="Eliminar opción" />

    <select id="idComponentes" name="componentes" class="form-control" size="1">

    </select>
