<!doctype html>
<html lang="es">
  <head>
    <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>04 · Suma con diálogos — Ejercicios Web07</title>
    <meta
      name="description"
      content="Ejercicio 04 de Web07: suma de campos con alert, confirm y prompt."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 4 va ANTES de styles.css: components.css lo reescribe -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        function esNumero(texto) {
          return /^\d{1,2}$/.test(texto);
        }

        function pedirPorPrompt(mensaje) {
          var valor = prompt(mensaje, "0");
          while (valor !== null && !esNumero(valor)) {
            valor = prompt(
              "Por favor, ingrese un número válido de máximo dos dígitos",
              "0",
            );
          }
          return valor;
        }

        function sumar() {
          var metodo = document.getElementById("metodo").value;

          if (metodo === "prompt") {
            var ingreso = pedirPorPrompt("Ingrese valor (máximo dos dígitos)");
            if (ingreso === null) return; // el usuario canceló el prompt
            document.getElementById("num1").value = ingreso;
          }

          var _x = document.getElementById("num1").value;
          var _y = document.getElementById("num2").value;

          if (!esNumero(_x) || !esNumero(_y)) {
            Swal.fire("Mensaje", "Ingrese números de máximo dos dígitos", "error");
            return;
          }

          var resultado = Number(_x) + Number(_y); // eval(texto)

          if (metodo === "confirm") {
            if (!confirm("¿Desea continuar?")) return;
            Swal.fire("Confirmado", resultado.toString(), "info");
          } else {
            Swal.fire("Mensaje", resultado.toString(), "info");
          }
        }

        document.getElementById("btnSumar").addEventListener("click", function () {
          sumar();
        });
      });
        </script>
  </head>

  <body class="legacy ejercicio" data-ejercicio="04">
    <header class="ej-head">
      <a href="ejercicios.html#ej04" class="ej-back">← Ejercicios</a>
      <span class="ej-num">04</span>
      <span class="ej-name">Suma con diálogos</span>
    </header>

    <div id="principal" class="form-group">
      <p class="mb-5">
        NÚMERO 1:
        <input type="text" id="num1" class="form-control" value="9" maxlength="2" />
      </p>
      <p class="mb-5">
        NÚMERO 2:
        <input type="text" id="num2" class="form-control" value="8" maxlength="2" />
      </p>
      <p class="mb-5">
        DIÁLOGO:
        <select id="metodo" class="form-control">
          <option value="alert">alert · muestra el resultado directo</option>
          <option value="confirm">confirm · pregunta antes de mostrar</option>
          <option value="prompt">prompt · pide el número 1</option>
        </select>
      </p>
      <p>
        <button id="btnSumar" class="btn btn-primary">Sumar</button>
      </p>
    </div>
  </body>
</html>
