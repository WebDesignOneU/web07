<!doctype html>
<html lang="es">
  <head>
  <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>20 · Tabla dinámica — Ejercicios Web07</title>
    <meta
      name="description"
      content="Ejercicio 20 de Web07: Tabla dinámica."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 4 va ANTES de styles.css: components.css lo reescribe -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript">
      function load() {
        document.querySelector("form[id='form_uno'] [id='cmdNuevo']").disabled = true;
        document.querySelector("form[id='form_uno'] [id='numeroCampos']").focus();
        document.querySelector("form[id='form_tres'] [id='cmdBajarDatos']").disabled = true;
      }

      document.addEventListener("DOMContentLoaded", function () {
        var num_fila_nueva = 0;

        function crearCampos() {
          var formUno = document.getElementById("form_uno");
          var numCampos = formUno.querySelector("[id='numeroCampos']").value;

          if (numCampos === "") {
            Swal.fire('Atención', 'Ingrese número de campos!', 'warning').then(() => load());
          } else if (isNaN(numCampos)) {
            Swal.fire('Error', 'Debe ingresar un número', 'error').then(() => load());
          } else {
            var objetoTexto = document.getElementById("idTextos");
            for (var i = 0; i < numCampos; i++) {
              var objItem = document.createElement("input");
              objItem.type = "text";
              objItem.id = "campo_" + i;
              objItem.value = "";
              objItem.className = "form-control";
              var objLabel = document.createElement("label");
              objLabel.appendChild(objItem);
              objetoTexto.appendChild(objLabel);
            }
            formUno.querySelector("[id='cmdCampos']").disabled = true;
            formUno.querySelector("[id='numeroCampos']").disabled = true;
            formUno.querySelector("[id='cmdNuevo']").disabled = false;
            document.querySelector(
              "form[id='form_tres'] [id='cmdBajarDatos']"
            ).disabled = false;
            document.querySelector("form[id='form_dos'] [id='campo_0']")?.focus();
          }
        }

        function bajarDatos() {
          var numCampos = document.querySelector(
            "form[id='form_uno'] [id='numeroCampos']"
          ).value;
          var lleno = true;

          for (var i = 0; i < numCampos; i++) {
            var d = document.getElementById("campo_" + i);
            if (d.value === "") lleno = false;
          }

          if (!lleno) {
            Swal.fire('Atención', 'Todos los campos deben tener datos', 'warning').then(() => {
              document.querySelector("form[id='form_dos'] [id='campo_0']")?.focus();
            });
          } else {
            var tabla = document.getElementById("idTabla");
            var fila = document.createElement("tr");

            for (var i = 0; i < numCampos; i++) {
              var d = document.getElementById("campo_" + i);
              var celda = document.createElement("td");
              celda.textContent = d.value;
              fila.appendChild(celda);
            }

            tabla.appendChild(fila);
            num_fila_nueva++;

            for (var i = 0; i < numCampos; i++) {
              document.getElementById("campo_" + i).value = "";
            }

            document.querySelector("form[id='form_dos'] [id='campo_0']")?.focus();
          }
        }

        function nuevaTabla() {
          var formUno = document.getElementById("form_uno");
          var numeroCampos = formUno.querySelector("[id='numeroCampos']");
          formUno.querySelector("[id='cmdCampos']").disabled = false;
          numeroCampos.disabled = false;
          numeroCampos.value = "";
          numeroCampos.focus();
          num_fila_nueva = 0;

          // Eliminamos los espacios de texto
          document.querySelectorAll("form[id='form_dos'] input").forEach(function (input) {
            input.remove();
          });
          // Eliminamos la tabla
          document.querySelectorAll("#idTabla tr").forEach(function (fila) {
            fila.remove();
          });
          load();
        }

        document.getElementById("cmdCampos").addEventListener("click", function () {
          crearCampos();
        });

        document.getElementById("cmdNuevo").addEventListener("click", function () {
          nuevaTabla();
        });

        document.getElementById("cmdBajarDatos").addEventListener("click", function () {
          bajarDatos();
        });
      });
        </script>
  </head>

  <body class="legacy ejercicio" data-ejercicio="20" onload="load()">
    <header class="ej-head">
      <a href="ejercicios.html#ej20" class="ej-back">← Ejercicios</a>
      <span class="ej-num">20</span>
      <span class="ej-name">Tabla dinámica</span>
    </header>

    <form id="form_uno" action="" class="form-group">
      <p>
        Ingrese número de campos:
        <input type="text" id="numeroCampos" value="" maxlength="3" size="3" class="form-control" />
      </p>
      <p>
        <button id="cmdCampos" class="btn btn-primary">
          Crear espacios de entrada
        </button>
        <button id="cmdNuevo" class="btn btn-primary">Nueva tabla</button>
      </p>
    </form>
    <form id="form_dos" action="">
      <div id="idTextos"></div>
    </form>
    <form id="form_tres" action="">
      <p>
        <button id="cmdBajarDatos" class="btn btn-primary">
          Bajar datos a la tabla
        </button>
      </p>
      <table id="idTabla"></table>
    </form>
  </body>
</html>
