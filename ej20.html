<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>20 · Tabla dinámica — Ejercicios Web07</title>

  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const formUno = document.getElementById("form_uno");
      const formDos = document.getElementById("form_dos");
      const formTres = document.getElementById("form_tres");

      const numeroCampos = document.getElementById("numeroCampos");
      const contenedorInputs = document.getElementById("idTextos");
      const tabla = document.getElementById("idTabla");

      const btnCrearCampos = document.getElementById("cmdCampos");
      const btnNuevaTabla = document.getElementById("cmdNuevo");
      const btnBajarDatos = document.getElementById("cmdBajarDatos");

      let numFilas = 0;

      function load() {
        btnNuevaTabla.disabled = true;
        btnBajarDatos.disabled = true;
        numeroCampos.focus();
      }

      load();

      // -----------------------------
      // 🔧 Crear campos dinámicos
      // -----------------------------
      btnCrearCampos.addEventListener("click", (e) => {
        e.preventDefault();

        const n = numeroCampos.value.trim();

        if (!n) {
          return Swal.fire("Atención", "Ingrese número de campos", "warning").then(load);
        }
        if (isNaN(n)) {
          return Swal.fire("Error", "Debe ingresar un número", "error").then(load);
        }

        contenedorInputs.innerHTML = "";

        for (let i = 0; i < n; i++) {
          const input = document.createElement("input");
          input.type = "number";
          input.id = `campo_${i}`;
          input.className = "form-control mb-2";
          input.step = "any";

          contenedorInputs.appendChild(input);
        }

        btnCrearCampos.disabled = true;
        numeroCampos.disabled = true;
        btnNuevaTabla.disabled = false;
        btnBajarDatos.disabled = false;

        document.getElementById("campo_0").focus();
      });

      // -----------------------------
      // 🔧 Validación de inputs (delegación)
      // -----------------------------
      formDos.addEventListener("input", (e) => {
        if (!e.target.matches("input[type='number']")) return;

        const val = e.target.value;
        if (val && !/^-?\d*\.?\d*$/.test(val)) {
          e.target.value = val.slice(0, -1);
        }
        e.target.classList.remove("is-invalid");
      });

      formDos.addEventListener("blur", (e) => {
        if (!e.target.matches("input[type='number']")) return;

        const val = e.target.value.trim();
        const num = parseFloat(val);

        if (val && (isNaN(num) || !isFinite(num))) {
          e.target.classList.add("is-invalid");
        }
      });

      // -----------------------------
      // 🔧 Bajar datos a la tabla
      // -----------------------------
      btnBajarDatos.addEventListener("click", (e) => {
        e.preventDefault();

        const n = parseInt(numeroCampos.value);
        let primerError = null;

        const valores = [...Array(n)].map((_, i) => {
          const input = document.getElementById(`campo_${i}`);
          const val = input.value.trim();

          if (!val) {
            primerError = primerError ?? input;
            return null;
          }

          const num = parseFloat(val);
          if (isNaN(num) || !isFinite(num)) {
            primerError = primerError ?? input;
            return null;
          }

          return num;
        });

        if (primerError) {
          Swal.fire("Atención", "Todos los campos deben ser números válidos", "warning")
            .then(() => primerError.focus());
          return;
        }

        const fila = document.createElement("tr");
        valores.forEach(num => {
          const td = document.createElement("td");
          td.textContent = Number.isInteger(num) ? num : num.toString();
          fila.appendChild(td);
        });

        tabla.appendChild(fila);
        numFilas++;

        // limpiar inputs
        [...Array(n)].forEach((_, i) => {
          document.getElementById(`campo_${i}`).value = "";
        });

        document.getElementById("campo_0").focus();
      });

      // -----------------------------
      // 🔧 Nueva tabla
      // -----------------------------
      btnNuevaTabla.addEventListener("click", (e) => {
        e.preventDefault();

        numeroCampos.disabled = false;
        numeroCampos.value = "";
        btnCrearCampos.disabled = false;

        contenedorInputs.innerHTML = "";
        tabla.innerHTML = "";

        numFilas = 0;
        load();
      });

    });
  </script>
</head>

<body class="legacy ejercicio" data-ejercicio="20">
  <header class="ej-head">
    <a href="ejercicios.html#ej20" class="ej-back">← Ejercicios</a>
    <span class="ej-num">20</span>
    <span class="ej-name">Tabla dinámica</span>
  </header>

  <form id="form_uno" class="form-group">
    <p>
      Ingrese número de campos:
      <input type="number" id="numeroCampos" min="1" max="20" class="form-control" />
    </p>
    <p>
      <button id="cmdCampos" class="btn btn-primary">Crear espacios de entrada</button>
      <button id="cmdNuevo" class="btn btn-primary">Nueva tabla</button>
    </p>
  </form>

  <form id="form_dos">
    <div id="idTextos"></div>
  </form>

  <form id="form_tres">
    <p>
      <button id="cmdBajarDatos" class="btn btn-primary">Bajar datos a la tabla</button>
    </p>
    <table id="idTabla" class="table table-bordered"></table>
  </form>
</body>
</html>
