    />
    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", function () {
        function quitarCheckBox() {
          var cbx = document.querySelectorAll("form[name='formCheck'] input");
          if (cbx.length > 0) {
            cbx[0].remove();
            var aQuitar = document.querySelector("form[name='formCheck'] a");
            if (aQuitar) aQuitar.remove();
          } else {
            Swal.fire("Mensaje", "No existe más opciones", "error");
          }
        }

        document.getElementById("cmdQuitar").addEventListener("click", function () {
          quitarCheckBox();
        });
      });
        </script>
  </head>

  <body class="legacy ejercicio" data-ejercicio="26">
    <header class="ej-head">
      <a href="ejercicios.html#ej26" class="ej-back">← Ejercicios</a>

      <span class="ej-name">Checks: limpiar</span>
    </header>

    <button id="cmdQuitar" class="btn btn-primary">
      Quitar primer Check Box
    </button>
    <form name="formCheck">
      <div id="idCheck">
        <input type="checkbox" name="lp" value="0" /><a>La Paz</a><br />

        <input type="checkbox" name="pt" value="2" /><a>Potosi</a><br />
        <input type="checkbox" name="cb" value="3" /><a>Cochabamba</a><br />
        <input type="checkbox" name="bn" value="4" /><a>Beni</a><br />
        <input type="checkbox" name="pn" value="5" /><a>Pando</a><br />
        <input type="checkbox" name="sc" value="6" /><a>Santa Cruz</a><br />
        <input type="checkbox" name="tr" value="7" /><a>Tarija</a><br />
        <input type="checkbox" name="ch" value="8" /><a>Chuquisaca</a><br />
      </div>
    </form>
  </body>
