<!doctype html>
<html lang="es">
  <head>
  <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>10 · Insertar aleatorios — Ejercicios Web07</title>
    <meta
      name="description"
      content="Ejercicio 10 de Web07: Insertar aleatorios."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 4 va ANTES de styles.css: components.css lo reescribe -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        function insertTexto() {
          document.querySelectorAll("p").forEach(function (parrafo) {
            var texto = (Math.random() * 1000).toFixed() + ") ";
            parrafo.textContent = texto + parrafo.textContent;
          });
        }

        document.getElementById("btnInsertar").addEventListener("click", function () {
          insertTexto();
        });
      });
        </script>
  </head>

  <body class="legacy ejercicio" data-ejercicio="10">
    <header class="ej-head">
      <a href="ejercicios.html#ej10" class="ej-back">← Ejercicios</a>
      <span class="ej-num">10</span>
      <span class="ej-name">Insertar aleatorios</span>
    </header>

    <button id="btnInsertar" class="btn btn-primary">Insertar textos</button>
    <p>Este es el parrafo uno</p>
    <p>Este es le parrafo dos</p>
    <p>Este es el parrafo tres</p>
    <p>Este es el parrafo cuatro</p>
  </body>
</html>
