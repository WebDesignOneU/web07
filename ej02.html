    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Bootstrap 4 va ANTES de styles.css: components.css lo reescribe -->

      rel="stylesheet"

    />
    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        function mensaje() {
          Swal.fire("Mensaje", "¡Eligió aquí!", "info");
        }

        document
          .getElementById("parrafo")
          .addEventListener("click", function () {
            mensaje();
          });
      });
        </script>

      <span class="ej-num">02</span>
      <span class="ej-name">Párrafo clic</span>
    </header>

    <div id="principal" class="row grow w-100">
      <p id="parrafo" class="mb-5 vh-50 bg-info">Hacer clic.</p>
      <p class="mb-5 vh-50 bg-warning">No puede hacer clic.</p>
    </div>
  </body>
