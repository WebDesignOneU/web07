<!doctype html>
<html lang="es">
  <head>
    <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Inscripción</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <!-- ── HEADER WEB07 ── -->
    <header class="w7-nav">
      <a href="index.html" class="w7-nav-brand">⚡ Web07</a>
      <div class="w7-nav-center">
        <span class="page-emoji">🎓</span>
        <span>Seminario</span>
      </div>
      <nav class="w7-nav-links">
        <a href="index.html" class="w7-nav-link">🏠 Inicio</a>
        <a href="showcase.html" class="w7-nav-link w7-showcase">🚀 Showcase</a>
      </nav>
    </header>

    <div class="container mt-5">
      <h1>Inscripción a Seminario</h1>
      <form id="formularioInscripcion">
        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="tipoParticipante">Tipo de Participante:</label>
          <select id="tipoParticipante" class="form-control">
            <option value="elija" selected>--Elija una opción--</option>
            <option value="estudiante">Estudiante</option>
            <option value="profesional">Profesional</option>
          </select>
        </div>
        <div class="form-group">
          <label>Costo de Inscripción:</label>
          <span id="costoInscripcionValor" class="font-weight-bold"></span>
        </div>
        <button type="submit" class="btn btn-primary">Inscribirse</button>
      </form>
    </div>
    <br />
    <input
      class="btn btn-primary"
      type="button"
      onclick="window.location.href = 'index.html'"
      value="Volver"
    />

    <script src="js/app.js" data-page="seminario"></script>

    <!-- ── FOOTER WEB07 ── -->
    <footer class="w7-footer">
      <span>© 2026 <strong>Tecnologías Web I</strong></span>
      <nav class="w7-footer-links">
        <a href="index.html">🏠 Inicio</a>
        <a href="showcase.html">🚀 Showcase</a>
        <a href="calculadora.html">🧮 Calculadora</a>
        <a href="auth.html">🔐 Autenticación</a>
        <a href="pokeclient.html">🐾 Pokédex</a>
      </nav>
    </footer>
  </body>
</html>
