<!doctype html>
<html lang="es">
  <head>
  <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>05 · Matriz 3x3 — Ejercicios Web07</title>
    <meta
      name="description"
      content="Ejercicio 05 de Web07: Matriz 3x3."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 4 va ANTES de styles.css: components.css lo reescribe -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        function cargar() {
          var matriz = new Array(3); // vector - columnas
          let cont = 0;
          for (let i = 0; i < 3; i++) matriz[i] = new Array(3); // vector - filas

          for (let i = 0; i < 3; i++) {
            // cargo la matriz
            for (let j = 0; j < 3; j++) {
              matriz[i][j] = ++cont; // pre incremento
            }
          }

          var table = document.createElement("table");
          table.className = "table table-bordered";
          for (let i = 0; i < 3; i++) {
            // imprimo la matriz en una tabla
            var row = document.createElement("tr");
            for (let j = 0; j < 3; j++) {
              var cell = document.createElement("td");
              cell.textContent = matriz[i][j];
              row.appendChild(cell);
            }
            table.appendChild(row);
          }
          document.body.appendChild(table);
        }

        // Llamar a la función cargar() al ingresar a la página
        cargar();
      });
        </script>
  </head>

  <body class="legacy ejercicio" data-ejercicio="05">

      <a href="ejercicios.html#ej05" class="ej-back">← Ejercicios</a>
      <span class="ej-num">05</span>

    </header>

    <p>Matrices</p>
  </body>
</html>
