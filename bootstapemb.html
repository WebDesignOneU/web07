<!doctype html>
<html lang="es">
  <head>
    <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Registro de Usuario con Bootstrap</title>
    <!-- Agregar los enlaces a los archivos de Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ── HEADER WEB07 ── -->
    <header class="w7-nav">
      <a href="index.html" class="w7-nav-brand">⚡ Web07</a>
      <div class="w7-nav-center">
        <span class="page-emoji">📝</span>
        <span>Form Bootstrap</span>
      </div>
      <nav class="w7-nav-links">
        <a href="index.html" class="w7-nav-link">🏠 Inicio</a>
        <a href="showcase.html" class="w7-nav-link w7-showcase">🚀 Showcase</a>
      </nav>
    </header>
    <div class="container mt-5">
      <h1>Registro de Usuario</h1>
      <form id="registroForm">
        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input
            type="text"
            class="form-control"
            id="nombre"
            placeholder="Ingrese su nombre"
            required
          />
        </div>
        <div class="form-group">
          <label for="email">Correo Electrónico:</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Ingrese su correo"
            required
          />
        </div>
        <div class="form-group">
          <label for="contrasena">Contraseña:</label>
          <input
            type="password"
            class="form-control"
            id="contrasena"
            placeholder="Ingrese su contraseña"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary">Registrarse</button>
      </form>
    </div>

    <br />
    <input
      class="btn btn-primary"
      type="button"
      onclick="window.location.href = 'index.html'"
      value="Volver"
    />

    <script>
      // Manejar el envío del formulario
      document.addEventListener("DOMContentLoaded", function () {
        document
          .getElementById("registroForm")
          .addEventListener("submit", function (event) {
            event.preventDefault();
            let nombre = document.getElementById("nombre").value;
            let email = document.getElementById("email").value;
            let contrasena = document.getElementById("contrasena").value;

            // Aquí puedes enviar los datos a un servidor o realizar otras acciones
            let mensaje =
              "Nombre: " +
              nombre +
              ", Email: " +
              email +
              ", Contraseña: " +
              contrasena;

            Swal.fire("Ingreso aceptado", mensaje, "success");
          });
      });
    </script>

    <!-- ── FOOTER WEB07 ── -->
    <footer class="w7-footer">
      <span>© 2026 <strong>Tecnologías Web I</strong></span>
      <nav class="w7-footer-links">
        <a href="index.html">🏠 Inicio</a>
        <a href="showcase.html">🚀 Showcase</a>
        <a href="calculadora.html">🧮 Calculadora</a>
        <a href="formulario.html">📋 Formulario</a>
        <a href="pokeclient.html">🐾 Pokédex</a>
      </nav>
    </footer>
  </body>
</html>
