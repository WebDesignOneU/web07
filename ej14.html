    <script>
      document.addEventListener("DOMContentLoaded", function () {
        function eliminaPrimerCampo() {
          var campos = document.querySelectorAll('form[name="formUno"] input');
          if (campos.length > 0) {
            campos[0].remove();
          } else {
            Swal.fire("Mensaje", "¡No existen más campos!", "error");
          }
        }

        document.getElementById("btnEliminar").addEventListener("click", function () {
          eliminaPrimerCampo();
        });
      });
        </script>
