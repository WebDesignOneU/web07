<!doctype html>
<html lang="es">
  <head>
    <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>16 · Checks: resumen, limpiar y radios — Ejercicios Web07</title>
    <meta
      name="description"
      content="Ejercicio 16 de Web07: checkboxes y radios generados con el DOM."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 4 va ANTES de styles.css: components.css lo reescribe -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", function () {
        var value1 = 0;
        var radioNum = 1;

        function agregarCheckBox() {
          var objetoCheck = document.getElementById("idCheck");
          var objetoCheckItem = document.createElement("input");
          objetoCheckItem.type = "checkbox";
          objetoCheckItem.className = "form-check-input";
          objetoCheckItem.name = "Check" + value1;
          objetoCheckItem.value = value1;
          var objetoTextNodo = document.createElement("span");
          objetoTextNodo.textContent = "Check " + value1++;
          var objetoLabel = document.createElement("label");
          objetoLabel.className = "form-check";
          objetoLabel.appendChild(objetoCheckItem);
          objetoLabel.appendChild(objetoTextNodo);
          objetoCheck.appendChild(objetoLabel);
        }

        function quitarCheckBox() {
          var cbx = document.querySelectorAll("form[name='formCheck'] input");
          if (cbx.length > 0) {
            var primero = cbx[0];
            var etiqueta = primero.closest("label");
            if (etiqueta) {
              etiqueta.remove();
            } else {
              primero.remove();
            }
          } else {
            Swal.fire("Mensaje", "No existe más opciones", "error");
          }
        }

        function contarChequeados() {
          var cbx = document.querySelectorAll("form[name='formCheck'] input");
          var sumaCbx = 0;
          cbx.forEach(function (input) {
            if (input.checked) sumaCbx++;
          });

          var elegido = "ninguno";
          document
            .querySelectorAll("form[name='fRadios'] input")
            .forEach(function (radio) {
              if (radio.checked) elegido = radio.value;
            });

          Swal.fire(
            "Mensaje",
            "Elegidos = " +
              sumaCbx +
              "\r" +
              "No elegidos = " +
              (cbx.length - sumaCbx) +
              "\r" +
              "Radio elegido = " +
              elegido,
            "info",
          );
        }

        function hizoClick(idOrden) {
          var radios = document.querySelectorAll("form[name='fRadios'] input");
          radios.forEach(function (radio) {
            radio.checked = radio.value == idOrden;
          });
        }

        function agregarRadio() {
          var dvr = document.getElementById("divRadiolist");
          var radio = document.createElement("input");
          radio.type = "radio";
          radio.className = "form-check-input";
          radio.name = "radios";
          radio.value = radioNum;
          radio.addEventListener("click", function () {
            hizoClick(this.value);
          });
          var objetoTextNodo = document.createElement("span");
          objetoTextNodo.textContent = "Mensaje radio " + radioNum;
          var objetoLabel = document.createElement("label");
          objetoLabel.className = "form-check";
          objetoLabel.appendChild(radio);
          objetoLabel.appendChild(objetoTextNodo);
          dvr.appendChild(objetoLabel);
          radioNum++;
        }

        document.getElementById("cmdAgregar").addEventListener("click", function () {
          agregarCheckBox();
        });

        document.getElementById("cmdQuitar").addEventListener("click", function () {
          quitarCheckBox();
        });

        document.getElementById("cmdContarElegidos").addEventListener("click", function () {
          contarChequeados();
        });

        document.getElementById("btnAddRadio").addEventListener("click", function () {
          agregarRadio();
        });
      });
        </script>
  </head>

  <body class="legacy ejercicio" data-ejercicio="16">
    <header class="ej-head">
      <a href="ejercicios.html#ej16" class="ej-back">← Ejercicios</a>
      <span class="ej-num">16</span>
      <span class="ej-name">Checks: resumen, limpiar y radios</span>
    </header>

    <button id="cmdAgregar" class="btn btn-primary">Agregar CheckBox</button>
    <button id="cmdContarElegidos" class="btn btn-primary">
      Contar elegidos
    </button>
    <button id="cmdQuitar" class="btn btn-primary">
      Quitar primer Check Box
    </button>
    <button id="btnAddRadio" class="btn btn-primary">Agregar radio</button>
    <form name="formCheck">
      <div id="idCheck" class="form-group">
        <label class="form-check">
          <input type="checkbox" name="lp" value="0" class="form-check-input" />
          La Paz
        </label>
        <label class="form-check">
          <input type="checkbox" name="or" value="1" class="form-check-input" />
          Oruro
        </label>
        <label class="form-check">
          <input type="checkbox" name="pt" value="2" class="form-check-input" />
          Potosi
        </label>
        <label class="form-check">
          <input type="checkbox" name="cb" value="3" class="form-check-input" />
          Cochabamba
        </label>
        <label class="form-check">
          <input type="checkbox" name="bn" value="4" class="form-check-input" />
          Beni
        </label>
        <label class="form-check">
          <input type="checkbox" name="pn" value="5" class="form-check-input" />
          Pando
        </label>
        <label class="form-check">
          <input type="checkbox" name="sc" value="6" class="form-check-input" />
          Santa Cruz
        </label>
        <label class="form-check">
          <input type="checkbox" name="tr" value="7" class="form-check-input" />
          Tarija
        </label>
        <label class="form-check">
          <input type="checkbox" name="ch" value="8" class="form-check-input" />
          Chuquisaca
        </label>
      </div>
    </form>
    <form name="fRadios" action="">
      <div id="divRadiolist" class="form-group"></div>
    </form>
  </body>
</html>
