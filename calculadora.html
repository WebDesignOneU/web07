<!doctype html>
<html lang="es">
  <head>
    <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora en JavaScript</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/calculadora.css" />
  </head>
  <body>
    <!-- ── HEADER WEB07 ── -->
    <header class="w7-nav">
      <a href="index.html" class="w7-nav-brand">⚡ Web07</a>
      <div class="w7-nav-center">
        <span class="page-emoji">🧮</span>
        <span>Calculadora</span>
      </div>
      <nav class="w7-nav-links">
        <a href="index.html" class="w7-nav-link">🏠 Inicio</a>
        <a href="showcase.html" class="w7-nav-link w7-showcase">🚀 Showcase</a>
      </nav>
    </header>

    <div id="calculator">
      <div class="operands">
        <div data-operand-1>0</div>
        <div data-operand-2>0</div>
      </div>
      <div class="btn-grid">
        <button data-clear>C</button>
        <button data-delete>←</button>
        <button data-operation>/</button>

        <button data-number>7</button>
        <button data-number>8</button>
        <button data-number>9</button>
        <button data-operation>*</button>

        <button data-number>4</button>
        <button data-number>5</button>
        <button data-number>6</button>
        <button data-operation>-</button>

        <button data-number>1</button>
        <button data-number>2</button>
        <button data-number>3</button>
        <button data-operation>+</button>

        <button data-number>0</button>
        <button data-number>.</button>
        <button data-equals>=</button>
      </div>
      <div id="copy">
        Hecho por <a href="#">Ing. Miguel Pacheco</a> 🐻‍❄️ © 2026
      </div>
      <input
        class="btn btn-primary"
        type="button"
        onclick="window.location.href = 'index.html'"
        value="Volver"
      />
    </div>

    <script src="js/app.js" data-page="calculadora"></script>

    <!-- ── FOOTER WEB07 ── -->
    <footer class="w7-footer">
      <span>© 2026 <strong>Tecnologías Web I</strong></span>
      <nav class="w7-footer-links">
        <a href="index.html">🏠 Inicio</a>
        <a href="showcase.html">🚀 Showcase</a>
        <a href="calculadora.html">🧮 Calculadora</a>
        <a href="auth.html">🔐 Autenticación</a>
        <a href="pokeclient.html">🐾 Pokédex</a>
      </nav>
    </footer>
  </body>
</html>
