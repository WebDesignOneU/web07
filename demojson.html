<!doctype html>
<html lang="es">
  <head>
  <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejemplo de JSON con JavaScript</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <style>
      .book-card {
        background: #fff;
        border: 1px solid #e1e5e9;
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1rem;
        box-shadow: 0 2px 8px rgba(0,0,0,.05);
        transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      }
      .book-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(0,0,0,.12);
        border-color: #0d6efd;
      }
      .book-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: #1a1d21;
        margin: 0 0 .5rem;
      }
      .book-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin: 0;
        color: #5a6268;
        font-size: .9rem;
      }
      .book-meta span {
        display: flex;
        align-items: center;
        gap: .35rem;
      }
      .book-meta strong {
        color: #343a40;
      }
      .books-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1rem;
      }
      @media (max-width: 576px) {
        .books-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <!-- ── HEADER WEB07 ── -->
    <header class="w7-nav">
      <a href="index.html" class="w7-nav-brand">⚡ Web07</a>

        <span>Demo JSON</span>
      </div>
      <nav class="w7-nav-links">
        <a href="index.html" class="w7-nav-link">🏠 Inicio</a>
        <a href="showcase.html" class="w7-nav-link w7-showcase">🚀 Showcase</a>
      </nav>
    </header>

    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">📚 Libros</h1>
        <span class="badge bg-primary fs-6">3 libros</span>
      </div>
      <div id="libros" class="books-grid"></div>
    </div>
    <br />
    <input
      class="btn btn-primary"
      type="button"
      onclick="window.location.href = 'index.html'"
      value="Volver"
    />

    <script src="js/app.js" data-page="demojson"></script>

    <!-- ── FOOTER WEB07 ── -->

        <a href="auth.html">🔐 Autenticación</a>
        <a href="pokeclient.html">🐾 Pokédex</a>
      </nav>
    </footer>
  </body>
</html>
