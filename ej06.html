<!doctype html>
<html lang="es">
  <head>
  <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>06 · Tipos de campo — Ejercicios Web07</title>
    <meta
      name="description"
      content="Ejercicio 06 de Web07: Tipos de campo."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 4 va ANTES de styles.css: components.css lo reescribe -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        function enviar() {
          let _vector = [];
          _vector[0] = document.getElementById("fecha").value;
          _vector[1] = document.getElementById("nombre").value;
          _vector[2] = document.getElementById("btnCancelar").value;
          _vector[3] = document.getElementById("color").value;

          let fechaX = new Date();
          var fechacad =
            fechaX.getDate() +
            "/" +
            (fechaX.getMonth() + 1) +
            "/" +
            fechaX.getFullYear() +
            " " +
            fechaX.getHours() +
            ":" +
            fechaX.getMinutes() +
            ":" +
            fechaX.getSeconds();

          Swal.fire("Mensaje", _vector.length.toString(), "info");
          Swal.fire("Mensaje", _vector[3].toString(), "info");
          Swal.fire("Mensaje", fechacad, "info");
        }

        function limpiar() {
          document.getElementById("nombre").value = "";
          document.getElementById("fecha").value = "";
          document.getElementById("color").value = "";
          document.getElementById("archivo").value = "";
          document.getElementById("correo").value = "";
          document.getElementById("hora").value = "";
          var imagen = document.getElementById("imagen");
          imagen.setAttribute("src", "");
          imagen.style.display = "none";
        }

        document
          .getElementById("archivo")
          .addEventListener("change", function (event) {
            var file = event.target.files[0];
            if (file) {
              var reader = new FileReader();
              reader.onload = function (e) {
                var imagen = document.getElementById("imagen");
                imagen.setAttribute("src", e.target.result);
                imagen.style.display = "inline-block";
              };
              reader.readAsDataURL(file);
            }
          });

        document
          .getElementById("btnEnviar")
          .addEventListener("click", function () {
            enviar();
          });

        document
          .getElementById("btnCancelar")
          .addEventListener("click", function () {
            limpiar();
          });
      });
        </script>
  </head>

  <body class="legacy ejercicio" data-ejercicio="06">
    <header class="ej-head">
      <a href="ejercicios.html#ej06" class="ej-back">← Ejercicios</a>
      <span class="ej-num">06</span>
      <span class="ej-name">Tipos de campo</span>
    </header>

    <div id="principal" class="form-group">
      <p>NOMBRE: <input type="text" id="nombre" class="form-control" /></p>
      <p>F. NAC: <input type="date" id="fecha" class="form-control" /></p>
      <p>COLOR: <input type="color" id="color" class="form-control" /></p>
      <p>ARCHIVO: <input type="file" id="archivo" class="form-control-file" /></p>
      <p>CORREO: <input type="email" id="correo" class="form-control" /></p>
      <p>HORA: <input type="time" id="hora" class="form-control" /></p>
      <p>IMAGEN: <input type="image" id="imagen" /></p>
      <p>
        <button id="btnEnviar" class="btn btn-primary">Enviar</button>
        <button id="btnCancelar" class="btn btn-primary">Cancelar</button>
      </p>
    </div>
  </body>
</html>
