<!doctype html>
<html lang="es">
  <head>
  <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>17 · Sumas de tabla — Ejercicios Web07</title>
    <meta
      name="description"
      content="Ejercicio 17 de Web07: Sumas de tabla."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 4 va ANTES de styles.css: components.css lo reescribe -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />

    <style>
      #tablaDatos td {
        transition: background-color 0.2s, outline 0.2s;
      }
      #tablaDatos td.highlight {
        background-color: #fff3cd !important;
        outline: 2px solid #ffc107;
        outline-offset: -2px;
        position: relative;
        z-index: 1;
      }
      #tablaDatos td.highlight-row {
        background-color: #d1ecf1 !important;
        outline: 2px solid #17a2b8;
        outline-offset: -2px;
      }
      #tablaDatos td.highlight-col {
        background-color: #f8d7da !important;
        outline: 2px solid #dc3545;
        outline-offset: -2px;
      }
      .btn.active-calc {
        box-shadow: 0 0 0 3px rgba(0,123,255,.4);
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const tabla = document.getElementById("tablaDatos");
        const btnSumar = document.getElementById("btnSumar");
        const btnColumnaDos = document.getElementById("btnColumnaDos");
        const btnFilaUno = document.getElementById("btnFilaUno");

        function clearHighlights() {
          tabla.querySelectorAll("td").forEach(td => {
            td.classList.remove("highlight", "highlight-row", "highlight-col");
          });
          [btnSumar, btnColumnaDos, btnFilaUno].forEach(b => b.classList.remove("active-calc"));
        }

        function sumaTabla() {
          clearHighlights();
          var suma = 0;
          var filas = tabla.querySelectorAll("tr");
          filas.forEach(function (fila) {
            var celdas = fila.querySelectorAll("td");
            celdas.forEach(function (celda) {
              suma += eval(celda.textContent);
              celda.classList.add("highlight");
            });
          });
          btnSumar.classList.add("active-calc");
          Swal.fire({
            title: 'Resultado',
            text: 'Suma de la tabla es = ' + suma,
            icon: 'success',
            confirmButtonText: 'OK'
          });
        }

        function sumaColumnaDos() {
          clearHighlights();
          var suma = 0;
          var filas = tabla.querySelectorAll("tr");
          filas.forEach(function (fila) {
            var celdas = fila.querySelectorAll("td");
            if (celdas[2]) {
              var celda = celdas[2];
              suma += eval(celda.textContent);
              celda.classList.add("highlight-col");
            }
          });
          btnColumnaDos.classList.add("active-calc");
          Swal.fire({
            title: 'Resultado',
            text: 'Suma de la columna 2 es = ' + suma,
            icon: 'success',
            confirmButtonText: 'OK'
          });
        }

        function sumaFilaUno() {
          clearHighlights();
          var suma = 0;
          var filas = tabla.querySelectorAll("tr");
          if (filas[1]) {
            var celdas = filas[1].querySelectorAll("td");
            celdas.forEach(function (celda) {
              suma += eval(celda.textContent);
              celda.classList.add("highlight-row");
            });
          }
          btnFilaUno.classList.add("active-calc");
          Swal.fire({
            title: 'Resultado',
            text: 'Suma de la fila 1 es = ' + suma,
            icon: 'success',
            confirmButtonText: 'OK'
          });
        }

        btnSumar.addEventListener("click", sumaTabla);
        btnColumnaDos.addEventListener("click", sumaColumnaDos);
        btnFilaUno.addEventListener("click", sumaFilaUno);
      });
        </script>
  </head>

  <body class="legacy ejercicio" data-ejercicio="17">
    <header class="ej-head">
      <a href="ejercicios.html#ej17" class="ej-back">← Ejercicios</a>
      <span class="ej-num">17</span>
      <span class="ej-name">Sumas de tabla</span>
    </header>

    <button id="btnSumar" class="btn btn-primary">Suma la tabla</button>
    <button id="btnColumnaDos" class="btn btn-primary">Suma la columa 2</button>
    <button id="btnFilaUno" class="btn btn-primary">Suma la fila 1</button>
    <br /><br />
    <table id="tablaDatos" class="table">
      <tr>
        <td rowspan="2">10</td>
        <td>20</td>
        <td>30</td>
        <td>40</td>
        <td>50</td>
        <td>60</td>
      </tr>
      <tr>
        <td>5</td>
        <td colspan="2">10</td>
        <td>15</td>
        <td colspan="2">20</td>
      </tr>
      <tr>
        <td>1</td>
        <td colspan="3">2</td>
        <td colspan="3">3</td>
      </tr>
    </table>
  </body>
</html>
