<!doctype html>
<html lang="es">
  <head>
  <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>12 · Formularios dinámicos — Ejercicios Web07</title>
    <meta
      name="description"
      content="Ejercicio 12 de Web07: Formularios dinámicos."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 4 va ANTES de styles.css: components.css lo reescribe -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var numCampo = 0;

        function agregarCampos() {
          var objetoTexto = document.getElementById("idCampos");
          var objetoItem = document.createElement("input");
          objetoItem.type = "text";
          objetoItem.id = "Campo_" + numCampo;
          objetoItem.value = "campo " + numCampo++;
          objetoTexto.appendChild(objetoItem);
        }

        document.getElementById("btnAgregar").addEventListener("click", function () {
          agregarCampos();
        });
      });
        </script>
  </head>

  <body class="legacy ejercicio" data-ejercicio="12">
    <header class="ej-head">
      <a href="ejercicios.html#ej12" class="ej-back">← Ejercicios</a>
      <span class="ej-num">12</span>
      <span class="ej-name">Formularios dinámicos</span>
    </header>

    <button id="btnAgregar" class="btn btn-primary">Agregar nuevo campo</button>
    <div id="idCampos"></div>
  </body>
</html>
