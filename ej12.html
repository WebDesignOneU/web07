<!doctype html>
<html lang="es">
  <head>
  <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>14 · Operaciones validadas — Ejercicios Web07</title>
    <meta
      name="description"
      content="Ejercicio 14 de Web07: Operaciones validadas."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 4 va ANTES de styles.css: components.css lo reescribe -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        function recuperarContenido() {
          var dato1 = document.getElementById("campo1").value;
          var dato2 = document.getElementById("campo2").value;
          var operacion = -1;
          var tipoInputs = document.querySelectorAll('input[name="grupo"]');
          tipoInputs.forEach(function (input) {
            if (input.checked) {
              operacion = input.value;
            }
          });

          var resultado;
          switch (operacion) {
            case "1":
              resultado = Number(dato1) + Number(dato2);
              Swal.fire("Mensaje", "La suma es = " + resultado, "success");
              break;
            case "2":
              resultado = Number(dato1) - Number(dato2);
              Swal.fire("Mensaje", "La resta es = " + resultado, "success");
              break;
            case "3":
              resultado = Number(dato1) * Number(dato2);
              Swal.fire("Mensaje", "El producto es = " + resultado, "success");
              break;
            case "4":
              if (dato2 != 0) {
                resultado = Number(dato1) / Number(dato2);
              } else {
                resultado = "Indefinido";
              }
              Swal.fire("Mensaje", "La división es = " + resultado, "success");
              break;
            default:
              Swal.fire("Mensaje", "Elija una operación", "error");
          }
        }

        function nuevaOperacion() {
          document.getElementById("campo1").value = "";
          document.getElementById("campo2").value = "";
          document.querySelectorAll('input[name="grupo"]').forEach(function (radio) {
            radio.checked = false;
          });
          document.getElementById("campo1").focus();
        }

        // Validar que solo se acepten números de hasta tres dígitos
        document.querySelectorAll("#campo1, #campo2").forEach(function (campo) {
          campo.addEventListener("input", function () {
            if (!/^\d{0,3}$/.test(this.value)) {
              this.value = this.value.slice(0, 3);
            }
          });
        });

        // Evitar que se ingresen letras u otros símbolos por teclado
        document.querySelectorAll("#campo1, #campo2").forEach(function (campo) {
          campo.addEventListener("keypress", function (event) {
            var keyCode = event.which ? event.which : event.keyCode;
            if (keyCode < 48 || keyCode > 57) {
              event.preventDefault();
            }
          });
        });

        document.getElementById("btnOperar").addEventListener("click", function () {
          recuperarContenido();
        });

        document.getElementById("btnNuevo").addEventListener("click", function () {
          nuevaOperacion();
        });
      });
        </script>
  </head>

  <body class="legacy ejercicio" data-ejercicio="14">
    <header class="ej-head">
      <a href="ejercicios.html#ej14" class="ej-back">← Ejercicios</a>
      <span class="ej-num">14</span>
      <span class="ej-name">Operaciones validadas</span>
    </header>

    <div class="form-group">
      <p>
        Ingrese un número:
        <input type="text" value="" id="campo1" class="form-control" />
      </p>
      <p>
        Ingrese otro número:
        <input type="text" value="" id="campo2" class="form-control" />
      </p>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="grupo" value="1" id="grupo1" />
        <label class="form-check-label" for="grupo1">Suma</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="grupo" value="2" id="grupo2" />
        <label class="form-check-label" for="grupo2">Resta</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="grupo" value="3" id="grupo3" />
        <label class="form-check-label" for="grupo3">Multiplicacion</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="grupo" value="4" id="grupo4" />
        <label class="form-check-label" for="grupo4">Division</label>
      </div>
      <p>
        <button id="btnOperar" class="btn btn-primary">Operar</button> &nbsp;
        <button id="btnNuevo" class="btn btn-primary">Nuevo</button>
      </p>
    </div>
  </body>
</html>
