<!doctype html>
<html lang="es">
  <head>
  <link rel="icon" href="favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>15 · Radio con doble clic — Ejercicios Web07</title>
    <meta
      name="description"
      content="Ejercicio 15 de Web07: Radio con doble clic."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 4 va ANTES de styles.css: components.css lo reescribe -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll('input[type="radio"]').forEach(function (radio) {
          radio.addEventListener("dblclick", function () {
            this.checked = false;
          });
        });
      });
        </script>
  </head>

  <body class="legacy ejercicio" data-ejercicio="15">
    <header class="ej-head">
      <a href="ejercicios.html#ej15" class="ej-back">← Ejercicios</a>
      <span class="ej-num">15</span>
      <span class="ej-name">Radio con doble clic</span>
    </header>

    <p>Elija la carrera de su preferencia (doble click=ninguno)</p>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="grupo" value="1" id="grupo1" />
      <label class="form-check-label" for="grupo1">Sistemas</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="grupo" value="2" id="grupo2" />
      <label class="form-check-label" for="grupo2">Industrial</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="grupo" value="3" id="grupo3" />
      <label class="form-check-label" for="grupo3">Civil</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="grupo" value="4" id="grupo4" />
      <label class="form-check-label" for="grupo4">Biomedica</label>
    </div>
  </body>
</html>
