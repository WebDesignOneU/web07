<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Calculadora</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ── HEADER WEB07 ── -->
    <header class="w7-nav">
      <a href="index.html" class="w7-nav-brand">⚡ Web07</a>
      <div class="w7-nav-center">
        <span class="page-emoji">➕</span>
        <span>Calc 2 Operandos</span>
      </div>
      <nav class="w7-nav-links">
        <a href="index.html" class="w7-nav-link">🏠 Inicio</a>
        <a href="showcase.html" class="w7-nav-link w7-showcase">🚀 Showcase</a>
      </nav>
    </header>
    <div class="container mt-5">
      <h1>Calculadora</h1>
      <form id="registroForm">
        <div class="form-group">
          <label for="num1">Número 1:</label>
          <input
            type="text"
            id="num1"
            class="form-control"
            placeholder="Número 1"
          />
        </div>
        <div class="form-group">
          <label for="num2">Número 2:</label>
          <input
            type="text"
            id="num2"
            class="form-control"
            placeholder="Número 2"
          />
        </div>
        <button id="btnSumar" class="btn btn-primary">Sumar</button>
        <button id="btnRestar" class="btn btn-secondary">Restar</button>
      </form>
    </div>

    <br />
    <input
      class="btn btn-primary"
      type="button"
      onclick="window.location.href = 'index.html'"
      value="Volver"
    />

    <script>
      // Manejar el envío del formulario
      document.addEventListener("DOMContentLoaded", function () {
        document
          .getElementById("btnSumar")
          .addEventListener("click", function (event) {
            event.preventDefault();
            let num1 = parseInt(document.getElementById("num1").value);
            let num2 = parseInt(document.getElementById("num2").value);
            let suma = num1 + num2;
            Swal.fire("Suma de valores", "Suma: " + suma, "success");
          });

        document
          .getElementById("btnRestar")
          .addEventListener("click", function (event) {
            event.preventDefault();
            let num1 = parseInt(document.getElementById("num1").value);
            let num2 = parseInt(document.getElementById("num2").value);
            let resta = num1 - num2;
            Swal.fire("Resta de valores", "Resta: " + resta, "success");
          });
      });
    </script>

    <!-- ── FOOTER WEB07 ── -->
    <footer class="w7-footer">
      <span>© 2026 <strong>Tecnologías Web I</strong></span>
      <nav class="w7-footer-links">
        <a href="index.html">🏠 Inicio</a>
        <a href="showcase.html">🚀 Showcase</a>
        <a href="calculadora.html">🧮 Calculadora</a>
        <a href="formulario.html">📋 Formulario</a>
        <a href="pokeclient.html">🐾 Pokédex</a>
      </nav>
    </footer>
  </body>
</html>
