  <body class="legacy ejercicio" data-ejercicio="08">
    <header class="ej-head">
      <a href="ejercicios.html#ej08" class="ej-back">← Ejercicios</a>
      <span class="ej-num">08</span>
      <span class="ej-name">Primer JS: saludo</span>
    </header>

    <input type="text" id="txtPersona" class="form-control" />
    <button id="btnSaludo" class="btn btn-primary">Saludo</button>
    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", function () {
        // Escribimos en el navegador
        var encabezado = document.createElement("h1");
        encabezado.textContent = "Bienvenido a JavaScript";
        document.body.prepend(encabezado);

        // Evento click para el botón
        document.getElementById("btnSaludo").addEventListener("click", function () {
          Swal.fire("Mensaje", document.getElementById("txtPersona").value, "info");
        });
      });
    </script>
  </body>
