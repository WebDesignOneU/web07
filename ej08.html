<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <title>08 · Suma con prompt — Ejercicios Web07</title>
    <meta
      name="description"
      content="Ejercicio 08 de Web07: Suma con prompt."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 4 va ANTES de styles.css: components.css lo reescribe -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        function confirmar() {
          if (confirm("¿Desea continuar?")) {
            var _x = 0;
            _x = prompt("Ingrese valor (máximo dos dígitos)", "0");

            // Validar que el valor ingresado sea un número de máximo dos dígitos
            while (!/^\d{1,2}$/.test(_x)) {
              _x = prompt(
                "Por favor, ingrese un número válido de máximo dos dígitos",
                "0",
              );
            }

            var _y = 8;
            var resultado = Number(_x) + _y;
            Swal.fire("Mensaje", resultado.toString(), "info");
          }
        }

        document
          .getElementById("btnSumar")
          .addEventListener("click", function () {
            confirmar();
          });
      });
        </script>
  </head>

  <body class="legacy ejercicio" data-ejercicio="08">
    <header class="ej-head">
      <a href="ejercicios.html#ej08" class="ej-back">← Ejercicios</a>
      <span class="ej-num">08</span>
      <span class="ej-name">Suma con prompt</span>
    </header>

    <div id="principal" class="row grow w-100">
      <button id="btnSumar" class="btn btn-primary">Sumar</button>
    </div>
  </body>
</html>
